# SonarQube analysis for the Customer Segmentation app (read by sonar-scanner in the Jenkinsfile).
sonar.projectKey=customer-segmentation-analysis
sonar.projectName=Customer Segmentation Analysis
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.exclusions=src/data/**,src/charts/**,**/*.pdf,**/*.csv
sonar.python.version=3.12

# Reports produced earlier in the pipeline (Test + Code Quality stages)
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.python.flake8.reportPaths=reports/flake8.txt

# Entry points and Streamlit view scripts are thin UI glue: keep them out of duplication checks.
sonar.cpd.exclusions=src/views/**

# Pipeline waits for the quality gate with waitForQualityGate (webhook), not here.
sonar.qualitygate.wait=false

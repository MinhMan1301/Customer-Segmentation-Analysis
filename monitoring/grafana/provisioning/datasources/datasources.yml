apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://cs-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://cs-alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: cs-devops

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["cs-alertmanager:9093"]

scrape_configs:
  # Application metrics exported by src/telemetry.py (prometheus_client)
  - job_name: cs-app
    static_configs:
      - targets: ["cs-production-app:8000"]
        labels: {env: production}
      - targets: ["cs-staging-app:8000"]
        labels: {env: staging}

  # Black-box probe: what a user sees (HTTP 200 from Streamlit's health endpoint)
  - job_name: cs-app-health
    scrape_interval: 10s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://cs-production-app:8501/_stcore/health"]
        labels: {env: production}
      - targets: ["http://cs-staging-app:8501/_stcore/health"]
        labels: {env: staging}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: cs-blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["cs-alertmanager:9093"]
  - job_name: blackbox
    static_configs:
      - targets: ["cs-blackbox:9115"]
